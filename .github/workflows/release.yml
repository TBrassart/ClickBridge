name: Build and publish ClickBridge v1 release

on:
  push:
    tags:
      - 'v1.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate v1 release tag
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $sourceVersion = (Select-String -Path app_version.py -Pattern '^APP_VERSION\s*=\s*"([^"]+)"$').Matches.Groups[1].Value
          if ($tagVersion -ne $sourceVersion) {
            throw "Release tag $env:GITHUB_REF_NAME must match APP_VERSION $sourceVersion in app_version.py."
          }

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Build ClickBridge executable
        run: python -m PyInstaller --noconfirm --clean ClickBridge.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" ClickBridge.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist\ClickBridge-Setup.exe).Hash.ToLowerInvariant()
          "$hash  ClickBridge-Setup.exe" | Set-Content -Encoding ascii dist\SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME dist\ClickBridge-Setup.exe dist\SHA256SUMS.txt --generate-notes
